<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUMBO PRO — Plataforma Educativa Interna</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="stylesheet" href="styles-platform.css?v=5.1">
</head>
<body class="platform-body">

  <!-- Header Navigation Bar (Hidden on Login/Register, shown ONLY when logged in) -->
  <nav class="platform-nav" id="platform-main-nav" style="display: none;">
    <div class="platform-nav-inner">
      <a href="#/dashboard" class="platform-logo">
        <img src="assets/logo.jpg" alt="Logo Rumbo Pro" class="platform-logo-img">
        <span>RUMBO PRO</span>
      </a>

      <div class="platform-menu-links" id="nav-menu-container">
        <!-- Dynamic links injected via JS ONLY when logged in -->
      </div>
    </div>
  </nav>

  <!-- Main View Container -->
  <main id="app-view-container">
    <!-- Active view content dynamically rendered by platform-router -->
  </main>

  <!-- Core Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="store-db.js?v=5.2"></script>
  <script src="certificate-generator.js?v=5.2"></script>
  <script>
    // Router & View Controller Logic
    document.addEventListener('DOMContentLoaded', () => {
      window.addEventListener('hashchange', renderCurrentRoute);

      // 1. Render immediately with 0ms delay from local store
      renderCurrentRoute();

      // 2. Initialize Cloud Sync & Real-Time in the background
      if (window.rumboDB) {
        window.rumboDB.initDatabase().then(() => {
          renderCurrentRoute();
        }).catch(err => console.warn('Background sync:', err));

        window.rumboDB.subscribeToLiveUpdates(() => {
          renderCurrentRoute();
        });
      }
    });

    function navigateTo(route) {
      window.location.hash = route;
    }

    function renderCurrentRoute() {
      const currentUser = window.rumboDB.getCurrentUser();
      let hash = window.location.hash || '#/dashboard';

      // Protection Guard: If not logged in and on protected route, go to login immediately
      if (!currentUser && hash !== '#/registro' && !hash.startsWith('#/verificar')) {
        hash = '#/login';
        if (window.location.hash !== '#/login') {
          history.replaceState(null, null, '#/login');
        }
      }

      const container = document.getElementById('app-view-container');

      // Update Navigation Header (only shows nav bar if logged in!)
      renderNavMenu(currentUser, hash);

      // Public Routes
      if (hash.startsWith('#/verificar')) {
        renderVerifyCertificatesView(container);
        return;
      }

      if (hash === '#/registro') {
        renderRegisterView(container);
        return;
      }

      if (hash === '#/login' || !currentUser) {
        renderLoginView(container);
        return;
      }

      // Check User Status (PENDIENTE / RECHAZADO / SUSPENDIDO)
      if (currentUser.role !== 'ADMINISTRADOR' && currentUser.status !== 'APROBADO') {
        renderPendingView(container, currentUser);
        return;
      }

      // Protected Student / Admin Routes
      if (hash === '#/dashboard') {
        renderDashboardView(container, currentUser);
      } else if (hash === '#/ideas-diarias' || hash === '#/ideas') {
        renderDailyIdeasFullView(container, currentUser);
      } else if (hash === '#/afiliados' || hash === '#/manual-afiliado') {
        renderAfiliadosManualView(container, currentUser);
      } else if (hash.startsWith('#/curso/')) {
        const courseId = hash.replace('#/curso/', '');
        renderCoursePlayerView(container, currentUser, courseId);
      } else if (hash === '#/certificados') {
        renderCertificatesView(container, currentUser);
      } else if (hash === '#/admin') {
        if (currentUser.role !== 'ADMINISTRADOR') {
          navigateTo('#/dashboard');
          return;
        }
        renderAdminView(container, currentUser);
      } else {
        renderDashboardView(container, currentUser);
      }
    }

    function renderNavMenu(user, currentHash) {
      const navEl = document.getElementById('platform-main-nav');
      const navContainer = document.getElementById('nav-menu-container');

      // 100% HIDE ENTIRE TOP BAR ON LOGIN OR REGISTER
      if (!user || currentHash === '#/login' || currentHash === '#/registro') {
        if (navEl) navEl.style.display = 'none';
        if (navContainer) navContainer.innerHTML = '';
        return;
      }

      // ONLY SHOW NAV BAR WHEN LOGGED IN INSIDE PLATFORM
      if (navEl) navEl.style.display = 'block';
      if (navContainer) {
        let adminLink = user.role === 'ADMINISTRADOR' ? `<a href="#/admin" class="platform-menu-link ${currentHash === '#/admin' ? 'active' : ''}">Panel Admin</a>` : '';

        navContainer.innerHTML = `
          <a href="#/dashboard" class="platform-menu-link ${currentHash === '#/dashboard' ? 'active' : ''}">Mis Cursos</a>
          <a href="#/ideas-diarias" class="platform-menu-link ${currentHash.startsWith('#/ideas') ? 'active' : ''}" style="color:#38bdf8; font-weight:700;">Ideas de Video 💡</a>
          <a href="#/afiliados" class="platform-menu-link ${currentHash.startsWith('#/afiliados') ? 'active' : ''}" style="color:#facc15; font-weight:700;">Manual Afiliados 💰</a>
          <a href="#/certificados" class="platform-menu-link ${currentHash === '#/certificados' ? 'active' : ''}">Certificados</a>
          ${adminLink}
          <a href="#/verificar" class="platform-menu-link ${currentHash.startsWith('#/verificar') ? 'active' : ''}">Verificar ID</a>
          <div class="user-badge-nav">
            <span>${user.firstName} ${user.lastName}</span>
            <span class="role-badge">${user.role}</span>
            <button class="btn-logout" onclick="handleLogout()">Salir</button>
          </div>
        `;
      }
    }

    function handleLogout() {
      window.rumboDB.logout();
      navigateTo('#/login');
    }

    // --- VIEW: LOGIN ---
    function renderLoginView(container) {
      container.innerHTML = `
        <div class="auth-container">
          <div class="auth-card">
            <h1 class="auth-title">Plataforma RUMBO PRO</h1>
            <p class="auth-subtitle">Ingresá a tu cuenta de alumno</p>

            <form id="login-form">
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="login-email" class="form-input" required placeholder="tu@email.com">
              </div>

              <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" id="login-password" class="form-input" required placeholder="••••••••">
              </div>

              <div id="login-error" style="color: #ef4444; font-size: 0.82rem; margin-bottom: 1rem; display: none;"></div>

              <button type="submit" class="btn-auth-submit">INICIAR SESIÓN</button>
            </form>

            <div class="auth-footer-link">
              ¿No tenés una cuenta? <a href="#/registro">Registrate acá</a>
            </div>
          </div>
        </div>
      `;

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-password').value;
        const errDiv = document.getElementById('login-error');

        errDiv.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'INGRESANDO...';

        try {
          await window.rumboDB.loginUser(email, pass);
          navigateTo('#/dashboard');
        } catch (err) {
          errDiv.textContent = err.message;
          errDiv.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'INICIAR SESIÓN';
        }
      });
    }

    // --- VIEW: REGISTRO ---
    function renderRegisterView(container) {
      container.innerHTML = `
        <div class="auth-container">
          <div class="auth-card">
            <h1 class="auth-title">Crear Cuenta</h1>
            <p class="auth-subtitle">Registrate en la academia de RUMBO PRO</p>

            <form id="register-form">
              <div class="form-group">
                <label class="form-label">Nombre</label>
                <input type="text" id="reg-firstname" class="form-input" required placeholder="Tu nombre">
              </div>

              <div class="form-group">
                <label class="form-label">Apellido</label>
                <input type="text" id="reg-lastname" class="form-input" required placeholder="Tu apellido">
              </div>

              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="reg-email" class="form-input" required placeholder="tu@email.com">
              </div>

              <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" id="reg-password" class="form-input" required placeholder="••••••••">
              </div>

              <div class="form-group">
                <label class="form-label">Confirmar Contraseña</label>
                <input type="password" id="reg-confirm" class="form-input" required placeholder="••••••••">
              </div>

              <div id="reg-error" style="color: #ef4444; font-size: 0.82rem; margin-bottom: 1rem; display: none;"></div>

              <button type="submit" class="btn-auth-submit">SOLICITAR REGISTRO</button>
            </form>

            <div class="auth-footer-link">
              ¿Ya tenés cuenta? <a href="#/login">Iniciá sesión</a>
            </div>
          </div>
        </div>
      `;

      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const fn = document.getElementById('reg-firstname').value;
        const ln = document.getElementById('reg-lastname').value;
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-password').value;
        const confirm = document.getElementById('reg-confirm').value;
        const errDiv = document.getElementById('reg-error');

        errDiv.style.display = 'none';

        if (pass !== confirm) {
          errDiv.textContent = 'Las contraseñas no coinciden.';
          errDiv.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'REGISTRANDO...';

        try {
          await window.rumboDB.registerUser({
            firstName: fn,
            lastName: ln,
            email: email,
            password: pass
          });
          await window.rumboDB.loginUser(email, pass);
          navigateTo('#/dashboard');
        } catch (err) {
          errDiv.textContent = err.message;
          errDiv.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'SOLICITAR REGISTRO';
        }
      });
    }

    // --- VIEW: PENDIENTE / RECHAZADO ---
    function renderPendingView(container, user) {
      let isRejected = user.status === 'RECHAZADO' || user.status === 'SUSPENDIDO';
      let boxClass = isRejected ? 'status-box-rejected' : 'status-box-pending';
      let title = isRejected ? 'ACCESO RESTRINGIDO' : 'SOLICITUD PENDIENTE DE APROBACIÓN';
      let msg = isRejected 
        ? `Tu cuenta se encuentra actualmente en estado: <strong>${user.status}</strong>. Ponete en contacto con la administración de RUMBO PRO para más información.`
        : `Hola <strong>${user.firstName}</strong>. Tus datos han sido enviados correctamente. Tu cuenta se encuentra en proceso de revisión manual. Una vez aprobada por la administración de RUMBO PRO, tendrás acceso inmediato a tus cursos.`;

      container.innerHTML = `
        <div class="auth-container">
          <div class="auth-card">
            <div class="${boxClass}">
              <h2 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 0.5rem;">${title}</h2>
              <p style="font-size: 0.88rem; line-height: 1.6;">${msg}</p>
            </div>

            <button class="btn-logout" style="width: 100%; padding: 0.75rem;" onclick="handleLogout()">CERRAR SESIÓN</button>
          </div>
        </div>
      `;
    }

    // --- VIEW: DASHBOARD DEL ALUMNO ---
    function renderDashboardView(container, user) {
      const courses = window.rumboDB.getUserCourses(user.id);
      const overall = window.rumboDB.getOverallStats(user.id);

      let cardsHtml = courses.map(course => {
        const stats = window.rumboDB.getCourseStats(user.id, course.id);
        const isFinished = stats.isCompleted;

        return `
          <div class="platform-course-card ${isFinished ? 'card-completed-border' : ''}">
            <div>
              <div class="p-course-header">
                <span class="p-course-icon">${course.icon}</span>
                <div>
                  <h3 class="p-course-title">${course.title}</h3>
                  <span class="role-badge ${isFinished ? 'badge-completed' : ''}">${isFinished ? 'COMPLETADO ✓' : course.badge}</span>
                </div>
              </div>
              <p class="p-course-desc">${course.description}</p>
            </div>

            <div>
              <div class="progress-bar-container">
                <div class="progress-info">
                  <span>PROGRESO DEL CURSO</span>
                  <span style="color:${isFinished ? '#34d399' : '#00c2ff'}; font-weight:800;">${stats.percentage}%</span>
                </div>
                <div class="progress-track">
                  <div class="progress-fill ${isFinished ? 'is-100' : ''}" style="width: ${stats.percentage}%;"></div>
                </div>
              </div>

              <!-- Action Buttons -->
              <div style="display:flex; flex-direction:column; gap:0.6rem;">
                <a href="${course.id === 'course-afiliados' ? '#/afiliados' : `#/curso/${course.id}`}" class="btn-continue-course" style="width:100%;">
                  ${course.id === 'course-afiliados' ? 'Abrir Manual del Afiliado ↗' : (isFinished ? 'Ver Material del Curso ↗' : 'Continuar Formación →')}
                </a>

                ${isFinished ? `
                  <button class="btn-continue-course btn-cert-unlocked" onclick="handleGenerateCert('${user.id}', '${course.id}')">
                    🏆 OBTENER CERTIFICADO OFICIAL
                  </button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="dashboard-container">
          <!-- Welcome Hero Banner -->
          <div class="dashboard-hero-banner">
            <div class="welcome-header">
              <span class="badge-pill">ACADEMIA RUMBO PRO</span>
              <h1 class="welcome-title">Hola, ${user.firstName} ${user.lastName}</h1>
              <p class="welcome-sub">Panel de estudiante. Avanzá en tus formaciones y obtené tus certificaciones oficiales.</p>
            </div>

            <!-- Stats Overview Bar -->
            <div class="stats-overview-grid">
              <div class="stat-mini-card">
                <span class="stat-mini-num">${overall.totalCourses}</span>
                <span class="stat-mini-label">Cursos Activos</span>
              </div>
              <div class="stat-mini-card">
                <span class="stat-mini-num" style="color:#34d399;">${overall.completedCourses}/${overall.totalCourses}</span>
                <span class="stat-mini-label">Completados</span>
              </div>
              <div class="stat-mini-card">
                <span class="stat-mini-num" style="color:#f59e0b;">${overall.totalCertificates}</span>
                <span class="stat-mini-label">Certificados Emitidos</span>
              </div>
              <div class="stat-mini-card stat-progress-card">
                <div style="display:flex; justify-content:space-between; font-size:0.78rem; font-weight:800; margin-bottom:0.4rem;">
                  <span>PROGRESO TOTAL</span>
                  <span style="color:#00c2ff;">${overall.percentage}%</span>
                </div>
                <div class="progress-track" style="height:10px;">
                  <div class="progress-fill ${overall.percentage === 100 ? 'is-100' : ''}" style="width:${overall.percentage}%;"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Quick Onboarding Guide for Newcomers -->
          <div class="onboarding-guide-card">
            <div class="onboarding-head">
              <span class="onboarding-badge">🚀 GUÍA RÁPIDA PARA NUEVOS ALUMNOS</span>
              <h3 class="onboarding-title">¿Cómo empezar en tu primer día en Rumbo Pro?</h3>
              <p class="onboarding-sub">Sigue estos 3 pasos simples para avanzar con total claridad desde hoy:</p>
            </div>
            
            <div class="onboarding-steps-grid">
              <div class="onboarding-step-box">
                <div class="onb-step-num">1</div>
                <div class="onb-step-icon">🧭</div>
                <h4 class="onb-step-title">1. Elegí tu Formación</h4>
                <p class="onb-step-desc">Explorá los cursos abajo (E-Commerce, Closer de Ventas, Hotmart o Community Manager) y elegí el área que más te apasione.</p>
              </div>

              <div class="onboarding-step-box">
                <div class="onb-step-num">2</div>
                <div class="onb-step-icon">🎬</div>
                <h4 class="onb-step-title">2. Mirá el Módulo 1</h4>
                <p class="onb-step-desc">Hacé clic en <strong>"Continuar Formación"</strong>. Mirá los videos en orden natural y aplicá lo aprendido paso a paso.</p>
              </div>

              <div class="onboarding-step-box highlight-onb">
                <div class="onb-step-num">3</div>
                <div class="onb-step-icon">💰</div>
                <h4 class="onb-step-title">3. ¿Querés Monetizar?</h4>
                <p class="onb-step-desc">Si querés ganar comisiones recomendando Rumbo Pro, abrí el <strong>Manual del Afiliado</strong> y usá las <strong>Ideas de Video Diarias</strong>.</p>
              </div>
            </div>
          </div>

          <!-- Featured VIP Affiliate Manual Banner -->
          <div class="manual-afiliado-banner">
            <div class="manual-banner-content">
              <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.5rem;">
                <span class="badge-pill" style="background:rgba(234,179,8,0.2); color:#facc15; border-color:rgba(234,179,8,0.5); font-weight:800;">MÓDULO EXCLUSIVO DE MONETIZACIÓN</span>
                <span style="font-size:0.8rem; color:#94a3b8;">100% Práctico</span>
              </div>
              <h2 class="manual-banner-title">💰 RUMBO PRO — MANUAL DEL AFILIADO</h2>
              <p class="manual-banner-desc">
                Aprendé a crear tu marca, atraer personas en redes sociales, cerrar ventas por WhatsApp y generar comisiones desde tu celular paso a paso.
              </p>
            </div>
            <a href="#/afiliados" class="btn-manual-action">
              ABRIR MANUAL DEL AFILIADO ↗
            </a>
          </div>

          <!-- Dynamic Daily Unique Video Idea Generator Box -->
          <div class="daily-video-idea-card" id="daily-idea-widget">
            <div class="daily-idea-header">
              <div>
                <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.35rem;">
                  <span class="idea-live-badge">💡 IDEA DE VIDEO DEL DÍA</span>
                  <span class="idea-unique-tag" id="idea-number-tag">Idea Exclusiva para ti</span>
                </div>
                <h3 class="idea-card-title">Guion Diario de Contenido para Vender Rumbo Pro</h3>
                <p class="idea-card-sub">Cada día una idea de video diferente para atraer clientes a tu WhatsApp. Nunca repetida.</p>
              </div>

              <div class="idea-actions-top">
                <button class="btn-generate-another" onclick="handleGenerateNextIdea('${user.id}')">
                  🔄 Otra Idea
                </button>
              </div>
            </div>

            <div class="idea-content-canvas" id="idea-content-box">
              <!-- Dynamically populated by window.rumboIdeaEngine -->
            </div>
          </div>

          <h2 class="courses-section-title">📚 Mis Cursos y Formaciones</h2>
          
          <div class="dashboard-courses-grid">
            ${cardsHtml || '<p>No tenés cursos asignados en este momento.</p>'}
          </div>
        </div>
      `;

      // Render the student's unique daily video idea
      window.rumboIdeaEngine.renderIdeaForUser(user.id);
    }

    // --- VIEW: IDEAS DE VIDEO DIARIAS & KIT DE VENTAS (Página Completa Dedicada) ---
    function renderDailyIdeasFullView(container, user) {
      container.innerHTML = `
        <div class="dashboard-container">
          
          <!-- Header Banner -->
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.75rem; flex-wrap:wrap; gap:1rem;">
            <div>
              <span class="badge-pill" style="background:rgba(234,179,8,0.15); color:#facc15; border-color:rgba(234,179,8,0.4); margin-bottom:0.5rem; display:inline-block; font-weight:800;">
                ⚡ ACELERADOR DE VENTAS PARA ALUMNOS
              </span>
              <h1 class="welcome-title" style="margin:0;">💡 Generador de Guiones Infinitos & Kit de Cierre</h1>
              <p class="welcome-sub" style="margin-top:0.35rem;">
                Herramientas listas para copiar y pegar para que generes prospectos en redes y cierres ventas de <strong>$87 USD</strong> por WhatsApp.
              </p>
            </div>

            <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
              <button class="btn-generate-another" style="font-size:0.95rem; padding:0.8rem 1.4rem;" onclick="handleGenerateNextIdea('${user.id}')">
                🎲 Generar Nuevo Guion Único
              </button>
            </div>
          </div>

          <!-- Mode Switcher (Con Rostro vs Marca Incógnita) -->
          <div class="script-mode-bar">
            <span style="font-size:0.85rem; font-weight:800; color:#94a3b8;">ESTILO DE CONTENIDO:</span>
            <div class="mode-buttons-group">
              <button type="button" id="btn-mode-face" class="mode-toggle-btn active-mode" onclick="setScriptMode('face', '${user.id}')">
                👤 Con Rostro (Marca Personal)
              </button>
              <button type="button" id="btn-mode-anon" class="mode-toggle-btn" onclick="setScriptMode('anon', '${user.id}')">
                🕶️ Marca Incógnita (Sin Mostrar Cara)
              </button>
            </div>
          </div>

          <!-- Main Script Canvas Container -->
          <div class="daily-video-idea-card" id="daily-idea-widget" style="margin-bottom:2.5rem; border-color:rgba(234,179,8,0.45); box-shadow:0 20px 50px rgba(0,0,0,0.5);">
            <div class="daily-idea-header">
              <div>
                <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.35rem;">
                  <span class="idea-live-badge">✨ GUION ÚNICO & EXCLUSIVO</span>
                  <span class="idea-unique-tag" id="idea-number-tag">Generado para ti</span>
                </div>
                <h3 class="idea-card-title">Estructura Lista para Grabar / Editar y Vender</h3>
              </div>

              <div class="idea-actions-top">
                <button class="btn-generate-another" onclick="handleGenerateNextIdea('${user.id}')">
                  🎲 Otro Guion
                </button>
              </div>
            </div>

            <div class="idea-content-canvas" id="idea-content-box">
              <!-- Rendered dynamically by window.rumboIdeaEngine -->
            </div>
          </div>

          <!-- ================================================================
               HERRAMIENTA 2: GENERADOR DE ENLACE DE WHATSAPP PARA BIOGRAFÍA
               ================================================================ -->
          <div class="affiliate-tool-card" style="margin-bottom:2.5rem;">
            <div class="tool-card-head">
              <div class="tool-icon-circle">🔗</div>
              <div>
                <h3 class="tool-title">Creador de Link Directo a tu WhatsApp</h3>
                <p class="tool-desc">Generá tu enlace personalizado para poner en la biografía de TikTok e Instagram. Tus prospectos te escribirán con 1 clic.</p>
              </div>
            </div>

            <div class="tool-body-grid">
              <div class="tool-input-group">
                <label class="form-label">Tu Número de WhatsApp (con código de país sin + ni espacios):</label>
                <input type="text" id="user-wa-number" class="form-input" placeholder="Ej: 5491123456789 (Argentina: 549... / México: 521...)" oninput="updateCustomWaLink()">
              </div>

              <div class="tool-input-group">

    // --- VIEW: REPRODUCTOR DE CURSO Y CLASES ---
    function renderCoursePlayerView(container, user, courseId) {
      const courses = window.rumboDB.getCourses();
      const course = courses.find(c => c.id === courseId);
      if (!course) {
        navigateTo('#/dashboard');
        return;
      }

      // Flatten all lessons with module info
      let allLessons = [];
      course.modules.forEach((m, mIdx) => {
        m.lessons.forEach((l, lIdx) => {
          allLessons.push({
            ...l,
            moduleId: m.id,
            moduleTitle: m.title,
            moduleNumber: mIdx + 1,
            totalModules: course.modules.length,
            lessonNumber: lIdx + 1
          });
        });
      });

      // Strict Natural Numerical Sorting (1, 2, 3 ... 9, 10, 11, 12, etc.)
      allLessons.sort((a, b) => (a.title || '').localeCompare((b.title || ''), undefined, { numeric: true, sensitivity: 'base' }));

      if (allLessons.length === 0) {
        container.innerHTML = `<div class="dashboard-container"><h2>Este curso aún no tiene material publicado.</h2><a href="#/dashboard" class="btn-continue-course" style="display:inline-block; margin-top:1rem;">Volver al Dashboard</a></div>`;
        return;
      }

      let selectedLessonId = allLessons[0].id;
      const isMultiLesson = allLessons.length > 1;

        const stats = window.rumboDB.getCourseStats(user.id, course.id);
        const currentLesson = allLessons.find(l => l.id === selectedLessonId) || allLessons[0];
        const progressList = window.rumboDB.getProgress();
        const isLessonDone = progressList.some(p => p.userId === user.id && p.lessonId === currentLesson.id);
        const isCourseFinished = stats.isCompleted;

        const currentIndex = allLessons.findIndex(l => l.id === currentLesson.id);

        // Render Clean & High-Contrast Folder / Module List if multi-lesson
        let modulesSidebarHtml = '';

            const isDone = progressList.some(p => p.userId === user.id && p.lessonId === l.id);
            const isActive = l.id === currentLesson.id;
            return `
              <div class="lesson-list-item ${isActive ? 'active-lesson' : ''}" onclick="selectLesson('${l.id}')">
                <div style="display:flex; align-items:center; gap:0.75rem;">

            <!-- Player Footer Controls & Info -->
            <div style="background:#0d1527; padding:1rem 1.4rem; border-top:1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">

                <span style="font-size:0.86rem; color:var(--text-silver);">
                  <strong>Tip de Estudio:</strong> Podés reproducir el video en pantalla completa y ajustar la velocidad de reproducción.
                </span>
              </div>
              <div style="display:flex; gap:0.6rem;">
                ${prevLesson ? `<button onclick="selectLesson('${prevLesson.id}')" style="background:rgba(255,255,255,0.06); color:#ffffff; border:1px solid rgba(255,255,255,0.15); padding:0.5rem 1rem; border-radius:8px; font-weight:700; font-size:0.84rem; cursor:pointer;">← Anterior</button>` : ''}
                ${nextLesson ? `<button onclick="selectLesson('${nextLesson.id}')" style="background:rgba(0,194,255,0.15); color:#00c2ff; border:1px solid rgba(0,194,255,0.3); padding:0.5rem 1rem; border-radius:8px; font-weight:700; font-size:0.84rem; cursor:pointer;">Siguiente →</button>` : ''}
              </div>
            </div>

          </div>
        `;

        container.innerHTML = `
          <div class="player-top-header">
            <a href="#/dashboard" class="btn-back-dashboard">← Volver al Panel Principal</a>
            <div style="display:flex; align-items:center; gap:0.65rem;">
              <span class="role-badge" style="font-size:0.85rem; padding:0.4rem 0.9rem; background:${isCourseFinished ? 'rgba(16,185,129,0.2)' : 'rgba(0,194,255,0.15)'}; color:${isCourseFinished ? '#34d399' : '#00c2ff'}; border-color:${isCourseFinished ? '#10b981' : 'var(--border-accent)'};">
                ${isCourseFinished ? '🏆 CURSO COMPLETADO AL 100%' : `Progreso del Curso: ${stats.percentage}%`}
              </span>
            </div>
          </div>

          <!-- Live Animated Progress Bar inside Course Player -->
          <div class="dashboard-container" style="padding: 0 1rem; margin-bottom: 1.25rem;">
            <div style="background:#0d1527; border:1px solid ${isCourseFinished ? '#10b981' : 'rgba(0,194,255,0.3)'}; border-radius:14px; padding:1.15rem 1.4rem; box-shadow:0 6px 25px rgba(0,0,0,0.4);">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.6rem;">
                <div style="display:flex; align-items:center; gap:0.5rem;">
                  <span style="font-size:1.1rem;">${isCourseFinished ? '🎉' : '📈'}</span>
                  <span style="font-size:0.88rem; font-weight:800; color:#ffffff; letter-spacing:0.04em;">BARRA DE PROGRESO DE ESTE CURSO</span>
                </div>
                <span style="font-size:1.15rem; font-weight:900; color:${isCourseFinished ? '#34d399' : '#00c2ff'};">
                  ${stats.percentage}% ${isCourseFinished ? '✓' : ''}

              </div>
              <div class="progress-track" style="height:14px; background:rgba(255,255,255,0.08); border-radius:50px; overflow:hidden; border:1px solid rgba(255,255,255,0.1);">

              </div>
            </div>
          </div>

          ${isCourseFinished ? `
            <div class="course-completed-celebration-banner" style="margin-left:auto; margin-right:auto; max-width:1280px;">
              <div style="display:flex; align-items:center; gap:0.85rem;">
                <span style="font-size:2.4rem;">🎉</span>
                <div>
                  <h3 style="font-weight:900; color:#ffffff; font-size:1.2rem; margin-bottom:0.2rem;">¡Felicitaciones! Has completado el 100% de esta formación.</h3>
                  <p style="font-size:0.88rem; color:#d1fae5;">Tu certificado oficial firmado por Pablo Xavier está listo para emitir y descargar.</p>
                </div>
              </div>
              <button class="btn-continue-course btn-cert-unlocked" style="width:auto; padding:0.85rem 1.75rem; font-size:0.95rem;" onclick="handleGenerateCert('${user.id}', '${course.id}')">
                🏆 OBTENER CERTIFICADO OFICIAL
              </button>
            </div>
          ` : ''}

          <div class="${isMultiLesson ? 'player-layout' : 'dashboard-container'}" style="${!isMultiLesson ? 'padding-top:0.25rem;' : ''}">
            ${isMultiLesson ? `
              <!-- Sidebar for multi-module courses (Community Manager) -->
              <div class="modules-sidebar">
                <div class="sidebar-header-box">
                  <span class="sidebar-course-tag">FORMACIÓN DIGITAL</span>
                  <h3 class="sidebar-course-title">${course.title}</h3>
                </div>

                <div style="display:flex; flex-direction:column; gap:0.5rem;">
                  ${modulesSidebarHtml}
                </div>
              </div>
            ` : ''}

            <!-- Main Content Area -->
            <div class="main-player-content">
              <div class="active-module-header">
                <h1 class="lesson-title-heading" style="font-size:1.6rem; color:#ffffff;">${isMultiLesson ? currentLesson.title : course.title}</h1>
                <p style="color:var(--text-silver); font-size:0.92rem; margin-bottom:1.25rem;">${currentLesson.content || course.description}</p>

              ${mediaViewerHtml}

              <div class="module-completion-card" style="background:#131d35; border:1px solid ${isLessonDone ? '#10b981' : 'rgba(0,194,255,0.4)'};">
                <div style="display:flex; align-items:center; gap:0.85rem;">
                  <span style="font-size:2rem;">${isLessonDone ? '✅' : '📌'}</span>
                  <div>
                    <h4 style="font-size:1.05rem; font-weight:800; color:#ffffff; margin-bottom:0.15rem;">
                      ${isLessonDone ? '¡Material Completado!' : '¿Terminaste de revisar este contenido?'}

                    <p style="font-size:0.86rem; color:${isLessonDone ? '#34d399' : 'var(--text-muted)'};">
                      ${isLessonDone ? 'Progreso sumado al 100% en la barra y certificado desbloqueado.' : 'Hacé clic en el botón verde para marcarlo como completado y subir tu barra de progreso.'}
                    </p>
                  </div>

                <div class="player-controls-bar" style="margin-top:1.25rem;">
                  <div>
                    ${prevLesson ? `<button class="btn-continue-course" style="width:auto; padding:0.6rem 1.25rem;" onclick="selectLesson('${prevLesson.id}')">← Anterior</button>` : '<span></span>'}
                  </div>
                  <div>
                    ${nextLesson ? `<button class="btn-continue-course" style="width:auto; padding:0.6rem 1.25rem;" onclick="selectLesson('${nextLesson.id}')">Siguiente →</button>` : ''}
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }

      window.selectLesson = (lessonId) => {
        selectedLessonId = lessonId;
        renderPlayerContent();

      window.handleToggleLessonAsync = async (uId, cId, lId, currentState) => {
        if (currentState) {
          await window.rumboDB.markLessonIncomplete(uId, cId, lId);
        } else {
          await window.rumboDB.markLessonComplete(uId, cId, lId);
        }
        renderPlayerContent();
      };

      renderPlayerContent();
    }
