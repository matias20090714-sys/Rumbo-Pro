<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUMBO PRO — Plataforma Educativa Interna</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="stylesheet" href="styles-platform.css">
</head>
<body class="platform-body">

  <!-- Header Navigation Bar -->
  <nav class="platform-nav">
    <div class="platform-nav-inner">
      <a href="index.html" class="platform-logo" id="nav-brand-logo">
        <img src="assets/logo.jpg" alt="Logo Rumbo Pro" class="platform-logo-img">
        <span>RUMBO PRO</span>
      </a>

      <div class="platform-menu-links" id="nav-menu-container">
        <!-- Dynamic links injected via JS -->
      </div>
    </div>
  </nav>

  <!-- Main View Container -->
  <main id="app-view-container">
    <!-- Active view content dynamically rendered by platform-router -->
  </main>

  <!-- Core Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="store-db.js"></script>
  <script src="certificate-generator.js"></script>
  <script>
    // Router & View Controller Logic
    document.addEventListener('DOMContentLoaded', () => {
      window.addEventListener('hashchange', renderCurrentRoute);

      // 1. Render immediately with 0ms delay from local store
      renderCurrentRoute();

      // 2. Initialize Cloud Sync & Real-Time in the background
      if (window.rumboDB) {
        window.rumboDB.initDatabase().then(() => {
          renderCurrentRoute();
        }).catch(err => console.warn('Background sync:', err));

        window.rumboDB.subscribeToLiveUpdates(() => {
          renderCurrentRoute();
        });
      }
    });

    function navigateTo(route) {
      window.location.hash = route;
    }

    function renderCurrentRoute() {
      let hash = window.location.hash;
      const currentUser = window.rumboDB ? window.rumboDB.getCurrentUser() : null;

      // Smart initial route resolution: if unauthenticated, go straight to login without flashing dashboard
      if (!hash || hash === '#' || hash === '#/') {
        hash = currentUser ? '#/dashboard' : '#/login';
        if (window.location.hash !== hash) {
          window.location.hash = hash;
          return;
        }
      }

      const container = document.getElementById('app-view-container');
      const brandLogo = document.getElementById('nav-brand-logo');

      // Set Brand Link destination
      if (brandLogo) {
        brandLogo.href = currentUser ? '#/dashboard' : 'index.html';
      }

      // Update Navigation Header (Strictly clean on login / register / unauthenticated)
      renderNavMenu(currentUser, hash);

      // Public / Auth Routes
      if (hash.startsWith('#/verificar')) {
        renderVerifyCertificatesView(container);
        return;
      }

      if (hash === '#/registro') {
        renderRegisterView(container);
        return;
      }

      if (hash === '#/login') {
        renderLoginView(container);
        return;
      }

      // Protection Guard: If not logged in, immediately render login view
      if (!currentUser) {
        navigateTo('#/login');
        return;
      }

      // Check User Status (PENDIENTE / RECHAZADO / SUSPENDIDO)
      if (currentUser.role !== 'ADMINISTRADOR' && currentUser.status !== 'APROBADO') {
        renderPendingView(container, currentUser);
        return;
      }

      // Protected Student / Admin Routes
      if (hash === '#/dashboard') {
        renderDashboardView(container, currentUser);
      } else if (hash === '#/ideas-diarias' || hash === '#/ideas') {
        renderDailyIdeasFullView(container, currentUser);
      } else if (hash === '#/afiliados' || hash === '#/manual-afiliado') {
        renderAfiliadosManualView(container, currentUser);
      } else if (hash.startsWith('#/curso/')) {
        const courseId = hash.replace('#/curso/', '');
        renderCoursePlayerView(container, currentUser, courseId);
      } else if (hash === '#/certificados') {
        renderCertificatesView(container, currentUser);
      } else if (hash === '#/admin') {
        if (currentUser.role !== 'ADMINISTRADOR') {
          navigateTo('#/dashboard');
          return;
        }
        renderAdminView(container, currentUser);
      } else {
        renderDashboardView(container, currentUser);
      }
    }

    function renderNavMenu(user, currentHash) {
      const navContainer = document.getElementById('nav-menu-container');
      if (!navContainer) return;

      const isAuthPage = currentHash === '#/login' || currentHash === '#/registro' || currentHash.startsWith('#/verificar');

      // For unauthenticated users or on Login/Register screens: Keep the header clean and minimalist
      if (!user || isAuthPage) {
        navContainer.innerHTML = `
          <a href="index.html" class="btn-back-home">
            ← Volver a la Web
          </a>
        `;
        return;
      }

      let adminLink = user.role === 'ADMINISTRADOR' ? `<a href="#/admin" class="platform-menu-link ${currentHash === '#/admin' ? 'active' : ''}">Panel Admin</a>` : '';

      navContainer.innerHTML = `
        <a href="#/dashboard" class="platform-menu-link ${currentHash === '#/dashboard' ? 'active' : ''}">Mis Cursos</a>
        <a href="#/ideas-diarias" class="platform-menu-link ${currentHash.startsWith('#/ideas') ? 'active' : ''}" style="color:#38bdf8; font-weight:700;">Ideas de Video 💡</a>
        <a href="#/afiliados" class="platform-menu-link ${currentHash.startsWith('#/afiliados') ? 'active' : ''}" style="color:#facc15; font-weight:700;">Manual Afiliados 💰</a>
        <a href="#/certificados" class="platform-menu-link ${currentHash === '#/certificados' ? 'active' : ''}">Certificados</a>
        ${adminLink}
        <a href="#/verificar" class="platform-menu-link ${currentHash.startsWith('#/verificar') ? 'active' : ''}">Verificar ID</a>
        <div class="user-badge-nav">
          <span>${user.firstName} ${user.lastName}</span>
          <span class="role-badge">${user.role}</span>
          <button class="btn-logout" onclick="handleLogout()">Salir</button>
        </div>
      `;
    }

    function handleLogout() {
      window.rumboDB.logout();
      navigateTo('#/login');
    }

    // --- VIEW: LOGIN ---
    function renderLoginView(container) {
      container.innerHTML = `
        <div class="auth-container">
          <div class="auth-card">
            <h1 class="auth-title">Plataforma RUMBO PRO</h1>
            <p class="auth-subtitle">Ingresá a tu cuenta de alumno</p>

            <form id="login-form">
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="login-email" class="form-input" required placeholder="tu@email.com">
              </div>

              <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" id="login-password" class="form-input" required placeholder="••••••••">
              </div>

              <div id="login-error" style="color: #ef4444; font-size: 0.82rem; margin-bottom: 1rem; display: none;"></div>

              <button type="submit" class="btn-auth-submit">INICIAR SESIÓN</button>
            </form>

            <div class="auth-footer-link">
              ¿No tenés una cuenta? <a href="#/registro">Registrate acá</a>
            </div>
          </div>
        </div>
      `;

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-password').value;
        const errDiv = document.getElementById('login-error');

        errDiv.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'INGRESANDO...';

        try {
          await window.rumboDB.loginUser(email, pass);
          navigateTo('#/dashboard');
        } catch (err) {
          errDiv.textContent = err.message;
          errDiv.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'INICIAR SESIÓN';
        }
      });
    }

    // --- VIEW: REGISTRO ---
    function renderRegisterView(container) {
      container.innerHTML = `
        <div class="auth-container">
          <div class="auth-card">
            <h1 class="auth-title">Crear Cuenta</h1>
            <p class="auth-subtitle">Registrate en la academia de RUMBO PRO</p>

            <form id="register-form">
              <div class="form-group">
                <label class="form-label">Nombre</label>
                <input type="text" id="reg-firstname" class="form-input" required placeholder="Tu nombre">
              </div>

              <div class="form-group">
                <label class="form-label">Apellido</label>
                <input type="text" id="reg-lastname" class="form-input" required placeholder="Tu apellido">
              </div>

              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="reg-email" class="form-input" required placeholder="tu@email.com">
              </div>

              <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" id="reg-password" class="form-input" required placeholder="••••••••">
              </div>

              <div class="form-group">
                <label class="form-label">Confirmar Contraseña</label>
                <input type="password" id="reg-confirm" class="form-input" required placeholder="••••••••">
              </div>

              <div id="reg-error" style="color: #ef4444; font-size: 0.82rem; margin-bottom: 1rem; display: none;"></div>

              <button type="submit" class="btn-auth-submit">SOLICITAR REGISTRO</button>
            </form>

            <div class="auth-footer-link">
              ¿Ya tenés cuenta? <a href="#/login">Iniciá sesión</a>
            </div>
          </div>
        </div>
      `;

      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const fn = document.getElementById('reg-firstname').value;
        const ln = document.getElementById('reg-lastname').value;
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-password').value;
        const confirm = document.getElementById('reg-confirm').value;
        const errDiv = document.getElementById('reg-error');

        errDiv.style.display = 'none';

        if (pass !== confirm) {
          errDiv.textContent = 'Las contraseñas no coinciden.';
          errDiv.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'REGISTRANDO...';

        try {
          await window.rumboDB.registerUser({
            firstName: fn,
            lastName: ln,
            email: email,
            password: pass
          });
          await window.rumboDB.loginUser(email, pass);
          navigateTo('#/dashboard');
        } catch (err) {
          errDiv.textContent = err.message;
          errDiv.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'SOLICITAR REGISTRO';
        }
      });
    }

    // --- VIEW: PENDIENTE / RECHAZADO ---
    function renderPendingView(container, user) {
      let isRejected = user.status === 'RECHAZADO' || user.status === 'SUSPENDIDO';
      let boxClass = isRejected ? 'status-box-rejected' : 'status-box-pending';
      let title = isRejected ? 'ACCESO RESTRINGIDO' : 'SOLICITUD PENDIENTE DE APROBACIÓN';
      let msg = isRejected 
        ? `Tu cuenta se encuentra actualmente en estado: <strong>${user.status}</strong>. Ponete en contacto con la administración de RUMBO PRO para más información.`
        : `Hola <strong>${user.firstName}</strong>. Tus datos han sido enviados correctamente. Tu cuenta se encuentra en proceso de revisión manual. Una vez aprobada por la administración de RUMBO PRO, tendrás acceso inmediato a tus cursos.`;

      container.innerHTML = `
        <div class="auth-container">
          <div class="auth-card">
            <div class="${boxClass}">
              <h2 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 0.5rem;">${title}</h2>
              <p style="font-size: 0.88rem; line-height: 1.6;">${msg}</p>
            </div>

            <button class="btn-logout" style="width: 100%; padding: 0.75rem;" onclick="handleLogout()">CERRAR SESIÓN</button>
          </div>
        </div>
      `;
    }

    // --- VIEW: DASHBOARD DEL ALUMNO ---
    function renderDashboardView(container, user) {
      const courses = window.rumboDB.getUserCourses(user.id);
      const overall = window.rumboDB.getOverallStats(user.id);

      let cardsHtml = courses.map(course => {
        const stats = window.rumboDB.getCourseStats(user.id, course.id);
        const isFinished = stats.isCompleted;

        return `
          <div class="platform-course-card ${isFinished ? 'card-completed-border' : ''}">
            <div>
              <div class="p-course-header">
                <span class="p-course-icon">${course.icon}</span>
                <div>
                  <h3 class="p-course-title">${course.title}</h3>
                  <span class="role-badge ${isFinished ? 'badge-completed' : ''}">${isFinished ? 'COMPLETADO ✓' : course.badge}</span>
                </div>
              </div>
              <p class="p-course-desc">${course.description}</p>
            </div>

            <div>
              <div class="progress-bar-container">
                <div class="progress-info">
                  <span>PROGRESO DEL CURSO</span>
                  <span style="color:${isFinished ? '#34d399' : '#00c2ff'}; font-weight:800;">${stats.percentage}%</span>
                </div>
                <div class="progress-track">
                  <div class="progress-fill ${isFinished ? 'is-100' : ''}" style="width: ${stats.percentage}%;"></div>
                </div>
              </div>

              <!-- Action Buttons -->
              <div style="display:flex; flex-direction:column; gap:0.6rem;">
                <a href="#/curso/${course.id}" class="btn-continue-course" style="width:100%;">
                  ${isFinished ? 'Ver Material del Curso ↗' : 'Continuar Formación →'}
                </a>

                ${isFinished ? `
                  <button class="btn-continue-course btn-cert-unlocked" onclick="handleGenerateCert('${user.id}', '${course.id}')">
                    🏆 OBTENER CERTIFICADO OFICIAL
                  </button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="dashboard-container">
          <!-- Welcome Hero Banner -->
          <div class="dashboard-hero-banner">
            <div class="welcome-header">
              <span class="badge-pill">ACADEMIA RUMBO PRO</span>
              <h1 class="welcome-title">Hola, ${user.firstName} ${user.lastName}</h1>
              <p class="welcome-sub">Panel de estudiante. Avanzá en tus formaciones y obtené tus certificaciones oficiales.</p>
            </div>

            <!-- Stats Overview Bar -->
            <div class="stats-overview-grid">
              <div class="stat-mini-card">
                <span class="stat-mini-num">${overall.totalCourses}</span>
                <span class="stat-mini-label">Cursos Activos</span>
              </div>
              <div class="stat-mini-card">
                <span class="stat-mini-num" style="color:#34d399;">${overall.completedCourses}/${overall.totalCourses}</span>
                <span class="stat-mini-label">Completados</span>
              </div>
              <div class="stat-mini-card">
                <span class="stat-mini-num" style="color:#f59e0b;">${overall.totalCertificates}</span>
                <span class="stat-mini-label">Certificados Emitidos</span>
              </div>
              <div class="stat-mini-card stat-progress-card">
                <div style="display:flex; justify-content:space-between; font-size:0.78rem; font-weight:800; margin-bottom:0.4rem;">
                  <span>PROGRESO TOTAL</span>
                  <span style="color:#00c2ff;">${overall.percentage}%</span>
                </div>
                <div class="progress-track" style="height:10px;">
                  <div class="progress-fill ${overall.percentage === 100 ? 'is-100' : ''}" style="width:${overall.percentage}%;"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Featured VIP Affiliate Manual Banner -->
          <div class="manual-afiliado-banner">
            <div class="manual-banner-content">
              <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.5rem;">
                <span class="badge-pill" style="background:rgba(234,179,8,0.2); color:#facc15; border-color:rgba(234,179,8,0.5); font-weight:800;">MÓDULO EXCLUSIVO DE MONETIZACIÓN</span>
                <span style="font-size:0.8rem; color:#94a3b8;">100% Práctico</span>
              </div>
              <h2 class="manual-banner-title">💰 RUMBO PRO — MANUAL DEL AFILIADO</h2>
              <p class="manual-banner-desc">
                Aprendé a crear tu marca, atraer personas en redes sociales, cerrar ventas por WhatsApp y generar comisiones desde tu celular paso a paso.
              </p>
            </div>
            <a href="#/afiliados" class="btn-manual-action">
              ABRIR MANUAL DEL AFILIADO ↗
            </a>
          </div>

          <!-- Dynamic Daily Unique Video Idea Generator Box -->
          <div class="daily-video-idea-card" id="daily-idea-widget">
            <div class="daily-idea-header">
              <div>
                <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.35rem;">
                  <span class="idea-live-badge">💡 IDEA DE VIDEO DEL DÍA</span>
                  <span class="idea-unique-tag" id="idea-number-tag">Guion Exclusivo para ti</span>
                </div>
                <h3 class="idea-card-title">Guion Diario de Contenido para Vender Rumbo Pro</h3>
                <p class="idea-card-sub">Estructuras probadas para TikTok, Reels y Shorts con ganchos virales y llamado a tu WhatsApp. Nunca repetidas.</p>
              </div>

              <div class="idea-actions-top">
                <button class="btn-generate-another" onclick="handleGenerateNextIdea('${user.id}')">
                  🔄 Otra Idea
                </button>
              </div>
            </div>

            <!-- Niche Filter Tabs -->
            <div class="idea-filter-tabs" id="idea-filters-dash">
              <button class="idea-filter-btn active" data-niche="all" onclick="handleIdeaFilterChange('${user.id}', 'all')">🌟 Todos los Nichos</button>
              <button class="idea-filter-btn" data-niche="ecom" onclick="handleIdeaFilterChange('${user.id}', 'ecom')">🛒 E-commerce</button>
              <button class="idea-filter-btn" data-niche="closer" onclick="handleIdeaFilterChange('${user.id}', 'closer')">🎯 Closer de Ventas</button>
              <button class="idea-filter-btn" data-niche="hotmart" onclick="handleIdeaFilterChange('${user.id}', 'hotmart')">🔥 Hotmart Fukuda</button>
              <button class="idea-filter-btn" data-niche="cm" onclick="handleIdeaFilterChange('${user.id}', 'cm')">📱 Community Manager / IA</button>
              <button class="idea-filter-btn" data-niche="afi" onclick="handleIdeaFilterChange('${user.id}', 'afi')">💰 Afiliados & Rumbo Pro</button>
              <button class="idea-filter-btn" data-niche="mentalidad" onclick="handleIdeaFilterChange('${user.id}', 'mentalidad')">🧠 Mentalidad & Tips</button>
            </div>

            <div class="idea-content-canvas" id="idea-content-box">
              <!-- Dynamically populated by window.rumboIdeaEngine -->
            </div>
          </div>

          <h2 class="courses-section-title">📚 Mis Cursos y Formaciones</h2>
          
          <div class="dashboard-courses-grid">
            ${cardsHtml || '<p>No tenés cursos asignados en este momento.</p>'}
          </div>
        </div>
      `;

      // Render the student's unique daily video idea
      window.rumboIdeaEngine.renderIdeaForUser(user.id);
    }

    // --- VIEW: IDEAS DE VIDEO DIARIAS (Página Completa Dedicada) ---
    function renderDailyIdeasFullView(container, user) {
      container.innerHTML = `
        <div class="dashboard-container">
          
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.75rem; flex-wrap:wrap; gap:1rem;">
            <div>
              <span class="badge-pill" style="background:rgba(0,194,255,0.15); color:#38bdf8; border-color:rgba(0,194,255,0.4); margin-bottom:0.5rem; display:inline-block;">
                GENERADOR EXCLUSIVO DE CONTENIDO
              </span>
              <h1 class="welcome-title" style="margin:0;">💡 Ideas de Video Diarias para Alumnos</h1>
              <p class="welcome-sub" style="margin-top:0.35rem;">
                Cada día recibes un guion único para tus redes (TikTok, Reels, Shorts). Presiona <strong>"🔄 Otra Idea"</strong> para generar un guion 100% nuevo en tiempo real.
              </p>
            </div>

            <div>
              <button class="btn-generate-another" style="font-size:1rem; padding:0.85rem 1.6rem;" onclick="handleGenerateNextIdea('${user.id}')">
                🔄 Otra Idea
              </button>
            </div>
          </div>

          <!-- Main Idea Canvas Container -->
          <div class="daily-video-idea-card" id="daily-idea-widget" style="margin-bottom:2rem; border-color:rgba(0,194,255,0.45); box-shadow:0 20px 50px rgba(0,0,0,0.5);">
            <div class="daily-idea-header">
              <div>
                <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.35rem;">
                  <span class="idea-live-badge">⚡ GUION ACTIVO</span>
                  <span class="idea-unique-tag" id="idea-number-tag">Guion Exclusivo para ti</span>
                </div>
                <h3 class="idea-card-title">Estructura Lista para Grabar y Vender</h3>
              </div>

              <div class="idea-actions-top">
                <button class="btn-generate-another" onclick="handleGenerateNextIdea('${user.id}')">
                  🔄 Otra Idea
                </button>
              </div>
            </div>

            <!-- Niche Filter Tabs -->
            <div class="idea-filter-tabs" id="idea-filters-full">
              <button class="idea-filter-btn active" data-niche="all" onclick="handleIdeaFilterChange('${user.id}', 'all')">🌟 Todos los Nichos</button>
              <button class="idea-filter-btn" data-niche="ecom" onclick="handleIdeaFilterChange('${user.id}', 'ecom')">🛒 E-commerce</button>
              <button class="idea-filter-btn" data-niche="closer" onclick="handleIdeaFilterChange('${user.id}', 'closer')">🎯 Closer de Ventas</button>
              <button class="idea-filter-btn" data-niche="hotmart" onclick="handleIdeaFilterChange('${user.id}', 'hotmart')">🔥 Hotmart Fukuda</button>
              <button class="idea-filter-btn" data-niche="cm" onclick="handleIdeaFilterChange('${user.id}', 'cm')">📱 Community Manager / IA</button>
              <button class="idea-filter-btn" data-niche="afi" onclick="handleIdeaFilterChange('${user.id}', 'afi')">💰 Afiliados & Rumbo Pro</button>
              <button class="idea-filter-btn" data-niche="mentalidad" onclick="handleIdeaFilterChange('${user.id}', 'mentalidad')">🧠 Mentalidad & Tips</button>
            </div>

            <div class="idea-content-canvas" id="idea-content-box">
              <!-- Rendered by window.rumboIdeaEngine -->
            </div>
          </div>

          <!-- Quick Recording Checklist Box -->
          <div class="manual-card-highlight" style="background:rgba(15,23,42,0.6); border-color:rgba(255,255,255,0.08);">
            <h4 style="color:#ffffff; font-weight:800; margin-bottom:0.5rem;">📋 Checklist Rápido antes de presionar REC:</h4>
            <div class="steps-5-grid" style="margin-top:1rem;">
              <div class="step-5-card">
                <span class="s5-num">1</span>
                <h4 class="s5-title">Lente limpio</h4>
                <p class="s5-text">Limpia la cámara de tu celular con tu remera.</p>
              </div>
              <div class="step-5-card">
                <span class="s5-num">2</span>
                <h4 class="s5-title">Luz de frente</h4>
                <p class="s5-text">Ventana o luz blanca apuntando a tu rostro.</p>
              </div>
              <div class="step-5-card">
                <span class="s5-num">3</span>
                <h4 class="s5-title">Gancho fuerte</h4>
                <p class="s5-text">Di la primera frase con energía en los primeros 2 seg.</p>
              </div>
              <div class="step-5-card">
                <span class="s5-num">4</span>
                <h4 class="s5-title">Subtítulos</h4>
                <p class="s5-text">Usa CapCut o auto-subtítulos en TikTok.</p>
              </div>

    // --- VIEW: REPRODUCTOR DE CURSO Y CLASES ---
    function renderCoursePlayerView(container, user, courseId) {
      const courses = window.rumboDB.getCourses();
      const course = courses.find(c => c.id === courseId);
      if (!course) {
        navigateTo('#/dashboard');
        return;
      }

      // Flatten all lessons with module info
      let allLessons = [];
      course.modules.forEach((m, mIdx) => {
        m.lessons.forEach((l, lIdx) => {
          allLessons.push({
            ...l,
            moduleId: m.id,
            moduleTitle: m.title,
            moduleNumber: mIdx + 1,
            totalModules: course.modules.length,
            lessonNumber: lIdx + 1
          });
        });
      });

      // Strict Natural Numerical Sorting (1, 2, 3 ... 9, 10, 11, 12, etc.)
      allLessons.sort((a, b) => (a.title || '').localeCompare((b.title || ''), undefined, { numeric: true, sensitivity: 'base' }));

      if (allLessons.length === 0) {
        container.innerHTML = `<div class="dashboard-container"><h2>Este curso aún no tiene material publicado.</h2><a href="#/dashboard" class="btn-continue-course" style="display:inline-block; margin-top:1rem;">Volver al Dashboard</a></div>`;
        return;
      }

      let selectedLessonId = allLessons[0].id;
      const isMultiLesson = allLessons.length > 1;

        const stats = window.rumboDB.getCourseStats(user.id, course.id);
        const currentLesson = allLessons.find(l => l.id === selectedLessonId) || allLessons[0];
        const progressList = window.rumboDB.getProgress();
        const isLessonDone = progressList.some(p => p.userId === user.id && p.lessonId === currentLesson.id);
        const isCourseFinished = stats.isCompleted;

        const currentIndex = allLessons.findIndex(l => l.id === currentLesson.id);
        const prevLesson = currentIndex > 0 ? allLessons[currentIndex - 1] : null;
        const nextLesson = currentIndex < allLessons.length - 1 ? allLessons[currentIndex + 1] : null;

        // Render Clean & High-Contrast Folder / Module List if multi-lesson
        let modulesSidebarHtml = '';
        if (isMultiLesson) {
          modulesSidebarHtml = allLessons.map((l, idx) => {
            const isDone = progressList.some(p => p.userId === user.id && p.lessonId === l.id);
            const isActive = l.id === currentLesson.id;
            return `
              <div class="lesson-list-item ${isActive ? 'active-lesson' : ''}" onclick="selectLesson('${l.id}')">
                <div style="display:flex; align-items:center; gap:0.75rem;">
                  <span class="lesson-bullet ${isDone ? 'bullet-done' : ''}">${isDone ? '✓' : (idx + 1)}</span>

              <div style="display:flex; align-items:center; gap:0.6rem;">

                  Ver en Pantalla Completa ↗

            </div>

            <!-- Player Footer Controls & Info -->
            <div style="background:#0d1527; padding:1rem 1.4rem; border-top:1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
              <div style="display:flex; align-items:center; gap:0.6rem;">
                <span style="font-size:1.1rem;">💡</span>
                <span style="font-size:0.86rem; color:var(--text-silver);">
                  <strong>Tip de Estudio:</strong> Podés reproducir el video en pantalla completa y ajustar la velocidad de reproducción.
                </span>
              </div>
              <div style="display:flex; gap:0.6rem;">
                ${prevLesson ? `<button onclick="selectLesson('${prevLesson.id}')" style="background:rgba(255,255,255,0.06); color:#ffffff; border:1px solid rgba(255,255,255,0.15); padding:0.5rem 1rem; border-radius:8px; font-weight:700; font-size:0.84rem; cursor:pointer;">← Anterior</button>` : ''}
                ${nextLesson ? `<button onclick="selectLesson('${nextLesson.id}')" style="background:rgba(0,194,255,0.15); color:#00c2ff; border:1px solid rgba(0,194,255,0.3); padding:0.5rem 1rem; border-radius:8px; font-weight:700; font-size:0.84rem; cursor:pointer;">Siguiente →</button>` : ''}
              </div>
            </div>

          </div>
        `;

        container.innerHTML = `
          <div class="player-top-header">
            <a href="#/dashboard" class="btn-back-dashboard">← Volver al Panel Principal</a>
            <div style="display:flex; align-items:center; gap:0.65rem;">
              <span class="role-badge" style="font-size:0.85rem; padding:0.4rem 0.9rem; background:${isCourseFinished ? 'rgba(16,185,129,0.2)' : 'rgba(0,194,255,0.15)'}; color:${isCourseFinished ? '#34d399' : '#00c2ff'}; border-color:${isCourseFinished ? '#10b981' : 'var(--border-accent)'};">
                ${isCourseFinished ? '🏆 CURSO COMPLETADO AL 100%' : `Progreso del Curso: ${stats.percentage}%`}
              </span>
            </div>
          </div>

          <!-- Live Animated Progress Bar inside Course Player -->
          <div class="dashboard-container" style="padding: 0 1rem; margin-bottom: 1.25rem;">
            <div style="background:#0d1527; border:1px solid ${isCourseFinished ? '#10b981' : 'rgba(0,194,255,0.3)'}; border-radius:14px; padding:1.15rem 1.4rem; box-shadow:0 6px 25px rgba(0,0,0,0.4);">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.6rem;">
                <div style="display:flex; align-items:center; gap:0.5rem;">
                  <span style="font-size:1.1rem;">${isCourseFinished ? '🎉' : '📈'}</span>
                  <span style="font-size:0.88rem; font-weight:800; color:#ffffff; letter-spacing:0.04em;">BARRA DE PROGRESO DE ESTE CURSO</span>
                </div>
                <span style="font-size:1.15rem; font-weight:900; color:${isCourseFinished ? '#34d399' : '#00c2ff'};">
                  ${stats.percentage}% ${isCourseFinished ? '✓' : ''}
                </span>
              </div>
              <div class="progress-track" style="height:14px; background:rgba(255,255,255,0.08); border-radius:50px; overflow:hidden; border:1px solid rgba(255,255,255,0.1);">
                <div class="progress-fill ${isCourseFinished ? 'is-100' : ''}" style="width:${stats.percentage}%; height:100%; transition:width 0.5s ease; background:${isCourseFinished ? 'linear-gradient(90deg,#10b981,#34d399)' : 'linear-gradient(90deg,#0066ff,#00c2ff)'};"></div>

            </div>
          </div>

          ${isCourseFinished ? `
            <div class="course-completed-celebration-banner" style="margin-left:auto; margin-right:auto; max-width:1280px;">
              <div style="display:flex; align-items:center; gap:0.85rem;">
                <span style="font-size:2.4rem;">🎉</span>
                <div>
                  <h3 style="font-weight:900; color:#ffffff; font-size:1.2rem; margin-bottom:0.2rem;">¡Felicitaciones! Has completado el 100% de esta formación.</h3>
                  <p style="font-size:0.88rem; color:#d1fae5;">Tu certificado oficial firmado por Pablo Xavier está listo para emitir y descargar.</p>
                </div>
              </div>
              <button class="btn-continue-course btn-cert-unlocked" style="width:auto; padding:0.85rem 1.75rem; font-size:0.95rem;" onclick="handleGenerateCert('${user.id}', '${course.id}')">
                🏆 OBTENER CERTIFICADO OFICIAL
              </button>
            </div>
          ` : ''}

          <div class="${isMultiLesson ? 'player-layout' : 'dashboard-container'}" style="${!isMultiLesson ? 'padding-top:0.25rem;' : ''}">
            ${isMultiLesson ? `
              <!-- Sidebar for multi-module courses (Community Manager) -->
              <div class="modules-sidebar">
                <div class="sidebar-header-box">
                  <span class="sidebar-course-tag">FORMACIÓN DIGITAL</span>
                  <h3 class="sidebar-course-title">${course.title}</h3>
                </div>

                <div style="display:flex; flex-direction:column; gap:0.5rem;">
                  ${modulesSidebarHtml}
                </div>
              </div>

            <!-- Main Content Area -->
            <div class="main-player-content">
              <div class="active-module-header">
                <h1 class="lesson-title-heading" style="font-size:1.6rem; color:#ffffff;">${isMultiLesson ? currentLesson.title : course.title}</h1>

                <div style="display:flex; align-items:center; gap:0.85rem;">
                  <span style="font-size:2rem;">${isLessonDone ? '✅' : '📌'}</span>

                    <h4 style="font-size:1.05rem; font-weight:800; color:#ffffff; margin-bottom:0.15rem;">

                      ${isLessonDone ? 'Progreso sumado al 100% en la barra y certificado desbloqueado.' : 'Hacé clic en el botón verde para marcarlo como completado y subir tu barra de progreso.'}
                    </p>
                  </div>
                </div>

                <button class="btn-complete-lesson ${isLessonDone ? 'is-completed-btn' : ''}" style="font-size:1rem; padding:0.9rem 1.8rem; font-weight:900;" onclick="handleToggleLessonAsync('${user.id}', '${course.id}', '${currentLesson.id}', ${isLessonDone})">

              ${isMultiLesson ? `
                <div class="player-controls-bar" style="margin-top:1.25rem;">
                  <div>
                    ${prevLesson ? `<button class="btn-continue-course" style="width:auto; padding:0.6rem 1.25rem;" onclick="selectLesson('${prevLesson.id}')">← Anterior</button>` : '<span></span>'}

                  <div>
                    ${nextLesson ? `<button class="btn-continue-course" style="width:auto; padding:0.6rem 1.25rem;" onclick="selectLesson('${nextLesson.id}')">Siguiente →</button>` : ''}
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }

      window.selectLesson = (lessonId) => {
        selectedLessonId = lessonId;
        renderPlayerContent();
      };

      window.handleToggleLessonAsync = async (uId, cId, lId, currentState) => {
        if (currentState) {
          await window.rumboDB.markLessonIncomplete(uId, cId, lId);
        } else {
          await window.rumboDB.markLessonComplete(uId, cId, lId);
        }
        renderPlayerContent();
      };

      renderPlayerContent();
    }

    // --- VIEW: VERIFICAR CERTIFICADO ---
    function renderVerifyCertificatesView(container) {
      container.innerHTML = `
        <div class="auth-container">
          <div class="auth-card">
            <h1 class="auth-title">Verificar Certificado</h1>
            <p class="auth-subtitle">Ingresá el código de verificación único para validar su autenticidad oficial.</p>

            <form id="verify-form">
              <div class="form-group">
                <label class="form-label">Código de Verificación (ID)</label>
                <input type="text" id="verify-code-input" class="form-input" required placeholder="Ejemplo: RP-CERT-8F92A0">
              </div>

              <button type="submit" class="btn-auth-submit">VERIFICAR DIPLOMA</button>
            </form>

            <div id="verify-result-box" style="margin-top: 1.5rem; text-align: left; display: none;"></div>
          </div>
        </div>
      `;

      document.getElementById('verify-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const code = document.getElementById('verify-code-input').value;
        const resBox = document.getElementById('verify-result-box');
        const cert = window.rumboDB.verifyCertificate(code);

        if (cert) {
          resBox.className = 'status-box-pending';
          resBox.style.borderColor = '#10b981';
          resBox.style.color = '#ffffff';
          resBox.innerHTML = `
            <h3 style="color:#34d399; font-weight:800;">✅ CERTIFICADO VÁLIDO Y AUTÉNTICO</h3>
            <p style="font-size:0.88rem; margin-top:0.5rem;">
              <strong>Alumno:</strong> ${cert.userName}<br>
              <strong>Curso:</strong> ${cert.courseTitle}<br>
              <strong>Fecha de Emisión:</strong> ${cert.issueDate}<br>
              <strong>Emisor:</strong> ${cert.signature} (${cert.directorTitle})<br>
              <strong>ID Oficial:</strong> ${cert.id}
            </p>
          `;
        } else {
          resBox.className = 'status-box-rejected';
          resBox.innerHTML = `
            <h3 style="color:#fca5a5; font-weight:800;">❌ CERTIFICADO NO ENCONTRADO</h3>
            <p style="font-size:0.88rem; margin-top:0.5rem;">No existe ningún certificado registrado con el código ingresado. Verifica los caracteres e intentalo de nuevo.</p>
          `;
        }
        resBox.style.display = 'block';
      });
    }

      createPRNG: function(seed) {
        let a = seed;
        return function() {
          let t = a += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      },

      // User & Login-Session Isolated Storage Helper
      getTracker: function(userId) {
        const uId = String(userId || 'guest_user');
        const lifetimeKey = 'rumbo_user_seen_' + uId;
        const sessionKey = 'rumbo_user_session_' + uId;
        
        let lifetimeSeen = [];
        try {
          lifetimeSeen = JSON.parse(localStorage.getItem(lifetimeKey) || '[]');
          if (!Array.isArray(lifetimeSeen)) lifetimeSeen = [];
        } catch (e) {
          lifetimeSeen = [];
        }

        let sessionData = { lastSessionId: '', activeIdea: null, sessionCounter: 0, currentNiche: 'all' };
        try {
          const raw = localStorage.getItem(sessionKey);
          if (raw) sessionData = { ...sessionData, ...JSON.parse(raw) };
        } catch (e) {}

        // Check if user has started a new login session
        let isNewLogin = false;
        if (window.rumboDB && typeof window.rumboDB.getCurrentSession === 'function') {
          const currentSess = window.rumboDB.getCurrentSession();
          if (currentSess && currentSess.sessionId && currentSess.sessionId !== sessionData.lastSessionId) {
            sessionData.lastSessionId = currentSess.sessionId;
            sessionData.activeIdea = null; // Force new idea on every fresh login!
            sessionData.sessionCounter = 0;
            isNewLogin = true;
          }
        }

        return {
          userId: uId,
          lifetimeKey: lifetimeKey,
          sessionKey: sessionKey,
          lifetimeSeen: lifetimeSeen,
          sessionData: sessionData,
          isNewLogin: isNewLogin
        };
      },

      saveTracker: function(tracker) {
        try {
          localStorage.setItem(tracker.lifetimeKey, JSON.stringify(tracker.lifetimeSeen));
          localStorage.setItem(tracker.sessionKey, JSON.stringify(tracker.sessionData));
        } catch (e) {
          console.error('Error saving idea tracker', e);
        }
      },

      // Get next unseen idea isolated per user & per login session
      getUniqueIdea: function(userId, requestedNiche, forceNext = false) {
        const tracker = this.getTracker(userId);
        const niche = requestedNiche || tracker.sessionData.currentNiche || 'all';
        tracker.sessionData.currentNiche = niche;

        // If not forcing next and we have an active idea for this session & niche, keep showing it
        if (!forceNext && !tracker.isNewLogin && tracker.sessionData.activeIdea && (niche === 'all' || tracker.sessionData.activeIdea.nicheCategory === niche)) {
          return {
            idea: tracker.sessionData.activeIdea,
            sessionNumber: tracker.sessionData.sessionCounter || 1,
            lifetimeTotal: tracker.lifetimeSeen.length,
            niche: niche,
            isNewLogin: false
          };
        }

        // Seed PRNG uniquely using (User ID Hash + Session Identifier + Counter)
        const userSeed = this.hashString(tracker.userId);
        const sessionSeed = this.hashString(tracker.sessionData.lastSessionId || 'init_sess');
        const counterSeed = (tracker.sessionData.sessionCounter || 0) * 9973;
        const prng = this.createPRNG(userSeed ^ sessionSeed ^ counterSeed);

        // 1. Find unvisited handcrafted templates for this user
        let pool = this.templates.filter(t => {
          const matchesNiche = (niche === 'all' || t.nicheCategory === niche);
          const notSeen = !tracker.lifetimeSeen.includes(t.id);
          return matchesNiche && notSeen;
        });

        let selectedIdea = null;

        if (pool.length > 0) {
          // Shuffle pool deterministically using user's PRNG so each user gets a completely different sequence
          const poolIndex = Math.floor(prng() * pool.length);
          selectedIdea = pool[poolIndex];
        } else {
          // 2. Templates exhausted for this user/niche -> Generate unique combinatorial script!
          const m = this.matrix;
          let comboNicheObj = m.niches.find(n => n.key === niche);
          if (!comboNicheObj || niche === 'all') {
            const nicheIdx = Math.floor(prng() * m.niches.length);
            comboNicheObj = m.niches[nicheIdx];
          }

          let attempts = 0;
          while (attempts < 100) {
            const hIdx = Math.floor(prng() * m.hooks.length);
            const bIdx = Math.floor(prng() * m.bodies.length);
            const cIdx = Math.floor(prng() * m.ctas.length);
            const brIdx = Math.floor(prng() * m.brolls.length);
            const cpIdx = Math.floor(prng() * m.captions.length);

            const comboId = `combo-${comboNicheObj.key}-${hIdx}-${bIdx}-${cIdx}-${brIdx}`;
            if (!tracker.lifetimeSeen.includes(comboId)) {
              selectedIdea = {
                id: comboId,
                nicheCategory: comboNicheObj.key,
                niche: comboNicheObj.name,
                type: 'Estrategia Combinatoria Exclusiva',
                hook: m.hooks[hIdx],
                body: m.bodies[bIdx],
                cta: m.ctas[cIdx],
                broll: m.brolls[brIdx],
                caption: m.captions[cpIdx]
              };
              break;
            }
            attempts++;
          }

          // Fallback if needed
          if (!selectedIdea) {
            const dynamicId = `dyn-${tracker.userId}-${Date.now()}`;
            selectedIdea = {
              id: dynamicId,
              nicheCategory: comboNicheObj.key,
              niche: comboNicheObj.name,
              type: 'Generación Dinámica Única',
              hook: m.hooks[Math.floor(prng() * m.hooks.length)],
              body: m.bodies[Math.floor(prng() * m.bodies.length)],
              cta: m.ctas[Math.floor(prng() * m.ctas.length)],
              broll: m.brolls[Math.floor(prng() * m.brolls.length)],
              caption: m.captions[Math.floor(prng() * m.captions.length)]
            };
          }
        }

        // Record lifetime seen ID (never repeated for this user)
        if (!tracker.lifetimeSeen.includes(selectedIdea.id)) {
          tracker.lifetimeSeen.push(selectedIdea.id);
        }
        tracker.sessionData.sessionCounter = (tracker.sessionData.sessionCounter || 0) + 1;
        tracker.sessionData.activeIdea = selectedIdea;
        this.saveTracker(tracker);

        return {
          idea: selectedIdea,
          sessionNumber: tracker.sessionData.sessionCounter,
          lifetimeTotal: tracker.lifetimeSeen.length,
          niche: niche,
          isNewLogin: tracker.isNewLogin
        };
      },

      renderIdeaForUser: function(userId, customNiche = null, forceNext = false) {
        const container = document.getElementById('idea-content-box');
        const numberTag = document.getElementById('idea-number-tag');
        if (!container) return;

        const data = this.getUniqueIdea(userId, customNiche, forceNext);
        const idea = data.idea;

        // Update tag with user isolation info
        if (numberTag) {
          numberTag.textContent = `Guion #${data.sessionNumber} • ${idea.niche}`;
        }

        // Update active class on filter tab buttons (both in dashboard & full view)
        ['idea-filters-dash', 'idea-filters-full'].forEach(tabId => {
          const tabContainer = document.getElementById(tabId);
          if (tabContainer) {
            const btns = tabContainer.querySelectorAll('.idea-filter-btn');
            btns.forEach(b => {
              if (b.getAttribute('data-niche') === data.niche) {
                b.classList.add('active');
              } else {
                b.classList.remove('active');
              }
            });
          }
        });

        // Render card content with rich UI
        container.innerHTML = `
          <div class="idea-body-wrapper">
            
            <div class="idea-meta-row">
              <span class="idea-niche-pill">${idea.niche}</span>
              <span class="idea-type-pill">⚡ ${idea.type}</span>
              <span class="idea-type-pill" style="border-color:rgba(16,185,129,0.45); color:#34d399; font-weight:800;">
                ✨ Idea Exclusiva para tu Usuario (Sin Repetición)
              </span>
            </div>

            <!-- Hook Section -->
            <div class="idea-section-block">
              <div class="is-label">🎣 1. GANCHO VIRAL (Primeros 0-3 segundos frente a cámara):</div>
              <div class="is-hook-text">${idea.hook}</div>
            </div>

            <!-- Development Section -->
            <div class="idea-section-block">
              <div class="is-label">💡 2. VALOR & DESARROLLO (4 a 25 segundos):</div>
              <ul class="is-body-list">
                ${idea.body.map(pt => `<li>${pt}</li>`).join('')}
              </ul>
            </div>

            <!-- CTA Section -->
            <div class="idea-section-block highlight-cta-block">
              <div class="is-label" style="color:#facc15;">🗣️ 3. LLAMADA A LA ACCIÓN (CTA para atraer clientes a tu WhatsApp):</div>
              <div class="is-cta-text">${idea.cta}</div>
            </div>

            <!-- Tips & Caption Box -->
            <div class="idea-tips-grid">
              <div class="idea-tip-card">
                <div class="it-head">🎥 Dirección de Grabación / B-Roll:</div>
                <div class="it-text">${idea.broll}</div>
              </div>
              <div class="idea-tip-card">
                <div class="it-head">📝 Descripción y Hashtags para el Post:</div>
                <div class="it-text">${idea.caption}</div>
              </div>
            </div>

            <!-- Action Bar -->
            <div class="idea-bottom-bar">
              <button class="btn-copy-script" onclick="window.rumboIdeaEngine.copyFullScript('${idea.id}', '${userId}')">
                📋 Copiar Guion Completo
              </button>
              <button class="btn-another-inline" onclick="handleGenerateNextIdea('${userId}')">
                ⚡ Dame otra idea diferente
              </button>
            </div>

            <div class="idea-stats-bar">
              <span>🎯 Guion de esta sesión: <strong>#${data.sessionNumber}</strong> • Total vistos en tu historial: <strong>${data.lifetimeTotal}</strong></span>
              <span>🔒 Cola de ideas 100% individual por usuario</span>
            </div>

          </div>
        `;
      },

      copyFullScript: function(templateId, userId) {
        const tracker = this.getTracker(userId);
        let t = this.templates.find(x => x.id === templateId);
        if (!t && tracker.sessionData && tracker.sessionData.activeIdea && tracker.sessionData.activeIdea.id === templateId) {
          t = tracker.sessionData.activeIdea;
        }
        if (!t) return;

        const fullText = `🎬 GUION DE VIDEO PARA RUMBO PRO (${t.niche})\n\n` +
          `🎯 1. GANCHO (0-3s):\n${t.hook}\n\n` +
          `💡 2. DESARROLLO (4-25s):\n${t.body.join('\n')}\n\n` +
          `🗣️ 3. LLAMADA A LA ACCIÓN:\n${t.cta}\n\n` +
          `🎥 CÓMO GRABARLO:\n${t.broll}\n\n` +
          `📝 COPY Y HASHTAGS:\n${t.caption}`;
        
        window.copyText(fullText);
      }
    };

    // UI Handlers for generating next idea & switching niche tabs
    window.handleGenerateNextIdea = (userId) => {
      const tracker = window.rumboIdeaEngine.getTracker(userId);
      window.rumboIdeaEngine.renderIdeaForUser(userId, tracker.sessionData.currentNiche, true);
      
      const box = document.getElementById('daily-idea-widget');
      if (box) {
        box.classList.add('idea-pulse-animation');
        setTimeout(() => box.classList.remove('idea-pulse-animation'), 600);
      }
    };

    window.handleIdeaFilterChange = (userId, niche) => {
      window.rumboIdeaEngine.renderIdeaForUser(userId, niche, true);
      
      const box = document.getElementById('daily-idea-widget');
      if (box) {
        box.classList.add('idea-pulse-animation');
        setTimeout(() => box.classList.remove('idea-pulse-animation'), 600);
      }
    };

    window.handleAdminUpdateUser = async (userId, newStatus) => {
      await window.rumboDB.updateUserStatus(userId, newStatus);
      renderCurrentRoute();
    };
  </script>
</body>
</html>
